name: Update Stable IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "build_world_stable.py"
      - ".github/workflows/update_stable.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Strict verify international IPTV streams
        run: python build_world_stable.py

      - name: Commit stable playlists
        shell: bash
        run: |
          git add world_stable.m3u all_stable.m3u

          if git diff --cached --quiet; then
            echo "No stable playlist changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: refresh strict verified IPTV"
          git push
